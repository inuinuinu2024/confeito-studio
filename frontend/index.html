<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ConfeitO-StudiO — AI coloring workspace for manga pages" />
  <title>ConfeitO-StudiO</title>
  <style>
    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #111111; color: #E2E2E2;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 99999; font-family: sans-serif;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #A8C7FA; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div class="spinner"></div>
    <div style="font-size: 16px; font-weight: 500;">ConfeitO-StudiO 起動中...</div>
    <div style="font-size: 12px; color: #8E918F; margin-top: 8px;">バックエンドサーバーの準備を待機しています</div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/app.ts"></script>
</body>
</html>

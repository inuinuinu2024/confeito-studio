[project]
name = "confeito-studio-backend"
version = "0.1.0"
description = "Confeito-Studio backend — archive storage, Gemini proxy and image processing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "requests>=2.34.2",
    "rembg[cpu]>=2.0.50",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
notebook = ["jupyter", "ipykernel"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx2>=2.13.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
# User-facing messages stay on one line so they can be grepped; `ruff format` handles code layout.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Query", "fastapi.Depends"]
